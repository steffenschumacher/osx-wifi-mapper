name: Release macOS binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --locked
      - name: Build native macOS app bundle
        run: uv run pyinstaller --noconfirm --clean native_wifi_mapper.spec
      - name: Package native app and preserve its macOS bundle structure
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/WiFi Site Survey.app" \
            "wifi-site-survey-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "wifi-site-survey-macos-${{ matrix.arch }}.zip" > "wifi-site-survey-macos-${{ matrix.arch }}.zip.sha256"
      - name: Smoke-test the exact distributed native archive
        run: |
          TEST_DIR="$(mktemp -d)"
          ditto -x -k "wifi-site-survey-macos-${{ matrix.arch }}.zip" "$TEST_DIR"
          /usr/libexec/PlistBuddy -c "Print :NSLocationUsageDescription" "$TEST_DIR/WiFi Site Survey.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$TEST_DIR/WiFi Site Survey.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$TEST_DIR/WiFi Site Survey.app"
          "$TEST_DIR/WiFi Site Survey.app/Contents/MacOS/wifi-site-survey-native" &
          APP_PID=$!
          trap 'kill -9 "$APP_PID" 2>/dev/null || true; rm -rf "$TEST_DIR"' EXIT
          sleep 5
          kill -0 "$APP_PID"
          if lsof -nP -iTCP -sTCP:LISTEN | grep -q wifi-site; then
            echo "Native application unexpectedly opened a TCP listener"
            exit 1
          fi
          kill -TERM "$APP_PID"
          for attempt in {1..20}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              wait "$APP_PID" || true
              rm -rf "$TEST_DIR"
              trap - EXIT
              exit 0
            fi
            sleep 0.5
          done
          echo "Native application did not terminate after SIGTERM"
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-site-survey-macos-${{ matrix.arch }}
          path: |
            wifi-site-survey-macos-${{ matrix.arch }}.zip
            wifi-site-survey-macos-${{ matrix.arch }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wifi-site-survey-macos-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
