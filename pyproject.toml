[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osx-wifi-mapper"
version = "0.3.0"
description = "Native macOS and Windows Wi-Fi site surveys on an interactive floor plan"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Steffen Schumacher" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pillow>=10,<12",
  "pyside6>=6.8,<6.10",
  "plotly>=5.20,<7",
  "streamlit>=1.35,<2",
  "streamlit-plotly-events>=0.0.6,<1",
  "pyobjc-framework-CoreWLAN>=10; sys_platform == 'darwin'",
  "pyobjc-framework-CoreLocation>=10; sys_platform == 'darwin'",
]

[project.scripts]
wifi-site-survey = "wifi_site_survey_launcher:main"
wifi-site-survey-native = "native_wifi_mapper:main"
wifi-site-survey-diagnostics = "wifi_diagnostics:main"

[tool.uv]
required-version = ">=0.11.6"

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "detect-secrets>=1.5,<2",
  "pre-commit>=3.7,<4",
  "pyinstaller>=6.10,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
]

[tool.setuptools]
py-modules = [
  "macos_wifi",
  "native_wifi_mapper",
  "survey_core",
  "wifi_scanner",
  "wifi_diagnostics",
  "wifi_site_survey",
  "wifi_site_survey_launcher",
  "windows_wifi",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=survey_core --cov=native_wifi_mapper --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = [".git", ".venv", "build", "dist", "tests"]
